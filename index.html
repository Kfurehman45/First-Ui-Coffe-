<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Coffee(1st UI)</title>
</head>

<body>
    <div id="box">
        <nav>
            <ul id="left_ul">
                <li><img src="./assets/cf image.png" alt=""></li>
                <li id="text">Coffee</li>
            </ul>
            <ul id="right_ul">
                <li>Home</li>
                <li>About</li>
                <li>Menu</li>
                <li>Testimonials</li>
                <li>Gallery</li>
                <li>Contact</li>
            </ul>
        </nav>
        <div id="middle_sec">
            <div id="left_sec">
                <p id="txt1">Best coffee</p>
                <h2>Make your day great with our <br>special coffee !</h2>
                <p id="txt2">Welcome to our coffee paradise where every bean tells <br> a story and cup sparks joy.</p>
                <span id="btn_sec">
                    <button id="btn1">Oder Now</button>
                    <button id="btn2">Contact Us</button>
                </span>
            </div>
            <div id="right_sec">
                <img src="./assets/coffee main.png" alt="">
            </div>
        </div>
    </div>
</body>

</html>
